<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ahmed &amp; Reem · RSVPs</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#4A3426">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23B0894F' d='M12 21.5s-9.5-5.8-9.5-12.6A5.1 5.1 0 0 1 12 6.1a5.1 5.1 0 0 1 9.5 2.8c0 6.8-9.5 12.6-9.5 12.6z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cinzel:wght@400;500&family=Corinthia&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/rsvp.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="sprig" viewBox="0 0 40 12">
      <g fill="none" stroke="currentColor" stroke-width=".7" stroke-linecap="round">
        <path d="M4 9 C12 7 22 6 36 3"/>
        <path d="M12 7.4 C11 4.8 12.6 3 15 2.6 C15 5 13.8 6.6 12 7.4Z"/>
        <path d="M19 6.2 C18.4 3.6 20 1.8 22.6 1.6 C22.4 4 21 5.6 19 6.2Z"/>
        <path d="M26 5 C25.8 2.6 27.4 1 30 1 C29.6 3.2 28 4.6 26 5Z"/>
        <path d="M14 7 C16 9 18.6 9.6 21 8.6 C19 7.2 16.6 6.8 14 7Z"/>
        <path d="M21.6 5.8 C23.6 7.6 26.2 8 28.4 7 C26.4 5.6 24 5.4 21.6 5.8Z"/>
      </g>
    </symbol>
  </svg>

  <main class="wrap">
    <header class="head">
      <p class="caps head__label">Ahmed &amp; Reem</p>
      <svg class="sprig" aria-hidden="true"><use href="#sprig"/></svg>
      <h1 class="script head__title">Your replies</h1>
      <p class="head__sub">Every RSVP sent from the invitation.</p>
    </header>

    <!-- shown when Supabase isn't configured yet -->
    <section class="card notice" id="not-configured" hidden>
      <p>Supabase isn't connected yet. Add the project URL and anon key to <code>js/supabase-config.js</code>.</p>
    </section>

    <!-- passcode -->
    <section class="card signin" id="signin" hidden>
      <h2 class="caps signin__title">Enter the passcode</h2>
      <form id="signin-form" novalidate>
        <label class="field">
          <span class="field__label">Passcode</span>
          <input type="password" name="passcode" inputmode="numeric" autocomplete="off" required>
        </label>
        <button class="btn btn--solid" type="submit" id="signin-btn">Show replies</button>
        <p class="status" id="signin-status" role="status" aria-live="polite"></p>
      </form>
    </section>

    <!-- replies -->
    <section id="replies" hidden>
      <div class="bar">
        <div class="stats">
          <p class="stat"><span class="stat__num" id="stat-total">0</span><span class="caps stat__lbl">Replies</span></p>
          <p class="stat"><span class="stat__num" id="stat-messages">0</span><span class="caps stat__lbl">With a message</span></p>
        </div>
        <div class="tools">
          <input class="search" id="search" type="search" placeholder="Search names or messages" aria-label="Search names or messages" dir="auto">
          <button class="btn btn--line" type="button" id="refresh-btn">Refresh</button>
          <button class="btn btn--line" type="button" id="export-btn">Download CSV</button>
          <button class="btn btn--ghost" type="button" id="signout-btn">Lock</button>
        </div>
      </div>
      <p class="status" id="list-status" role="status" aria-live="polite"></p>
      <ol class="list" id="list"></ol>
      <p class="empty" id="empty" hidden>No replies yet. They'll show up here as guests send them.</p>
    </section>
  </main>

  <template id="reply-tpl">
    <li class="reply card">
      <div class="reply__head">
        <h3 class="reply__name" dir="auto"></h3>
        <time class="reply__time"></time>
      </div>
      <p class="reply__msg" dir="auto"></p>
      <button class="reply__del" type="button">Delete</button>
    </li>
  </template>

  <script src="js/supabase-config.js"></script>
  <script src="js/rsvp-admin.js"></script>
</body>
</html>
